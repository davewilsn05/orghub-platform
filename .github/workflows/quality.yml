name: Application verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: Install the pinned package manager
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install reviewed frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dependency security regressions
        run: pnpm test:dependency-guards
      - name: Typecheck all workspaces
        run: pnpm type-check
      - name: Lint all applications
        run: pnpm lint
      - name: Build all applications
        run: pnpm build
      - name: Audit all dependencies
        run: pnpm audit --audit-level low
